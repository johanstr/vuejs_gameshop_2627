<!DOCTYPE html>
<html lang="">
   <head>
      <meta charset="utf-8">
      <meta http-equiv="X-UA-Compatible" content="IE=edge">
      <meta name="viewport" content="width=device-width,initial-scale=1.0">

      <link rel="icon" href="<%= BASE_URL %>img/favicon.ico">

      <title><%= htmlWebpackPlugin.options.title %></title>

      <link rel="stylesheet" href="<%= BASE_URL %>css/bootstrap.min.css">
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/line-awesome@2/dist/line-awesome/css/line-awesome.min.css">
      <link rel="stylesheet" href="<%= BASE_URL %>css/styles.css">
   </head>

   <body>
      <noscript>
         <strong>We're sorry but <%= htmlWebpackPlugin.options.title %> doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
      </noscript>

      <!--  
            Onderstaande DIV is het hoofd-element voor de Vue-app 
            Hierin worden de Vue-componenten weergegeven 
      -->
      <div id="app"></div>
      <!-- built files will be auto injected -->

      <script type="text/javascript" src="<%= BASE_URL %>js/bootstrap.bundle.min.js"></script>
   </body>
</html>
